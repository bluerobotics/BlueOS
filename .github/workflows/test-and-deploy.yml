name: Test, Build and Deploy Images

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

on:
    workflow_dispatch:
    pull_request:
      # The build-images label starts the Raspberry images build. Any other label skips the tests, and with them
      # everything that needs them (see their if)
      types: [opened, synchronize, reopened, labeled]
    push:
    schedule:
    # Run every 6 days to keep our caches alive
    - cron: '0 0 */6 * *'

jobs:
  python-tests:
    if: github.event.action != 'labeled' || github.event.label.name == 'build-images'
    runs-on: ubuntu-latest

    env:
      python-version: 3.11 # Our base image has Python 3.11

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ env.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get install --no-install-recommends --assume-yes shellcheck parallel

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v8.0.0

    - name: Run tests
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        .hooks/pre-push

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: ./core/htmlcov
        if-no-files-found: ignore


  frontend-tests:
    if: github.event.action != 'labeled' || github.event.label.name == 'build-images'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bun install
        run: bun install --frozen-lockfile --cwd ./core/frontend

      - name: Bun lint
        run: bun --cwd ./core/frontend lint

      - name: Bun type-check
        run: bun run --cwd ./core/frontend type-check

      - name: Bun build
        run: NODE_OPTIONS=--max-old-space-size=8192 bun run --cwd ./core/frontend build

  deploy-docker-images:
    runs-on: ubuntu-latest
    needs: [frontend-tests, python-tests]
    strategy:
      fail-fast: false
      matrix:
        docker: [bootstrap, core]
        project: [blueos]
        platforms: ["linux/arm/v7,linux/arm64/v8,linux/amd64"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 #Number of commits to fetch. 0 indicates all history for all branches and tags.
          submodules: recursive

      - name: Prepare
        id: prepare
        run: |
          # Deploy image with the name of the branch, if the build is a git tag, replace tag with the tag name.
          # If git tag matches semver, append latest tag to the push.
          DOCKER_IMAGE=${DOCKER_USERNAME:-bluerobotics}/${{ matrix.project }}-${{ matrix.docker }}
          VERSION=${GITHUB_REF##*/}

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          fi

          TAGS="--tag ${DOCKER_IMAGE}:${VERSION}"
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="$TAGS --tag ${DOCKER_IMAGE}:latest"
          fi

          echo "docker_image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # Every build reads the registry cache. Only master writes it: one shared tag, so
          # concurrent pushes from other refs would overwrite each other. Tags are left out on
          # purpose: they are cut from master, whose push already wrote the cache.
          if [[ "${GITHUB_REF}" == 'refs/heads/master' && "${{ github.event_name }}" != 'pull_request' ]]; then
            echo "buildx_registry_cache_to=--cache-to 'type=registry,ref=${DOCKER_IMAGE}:buildcache,mode=max'" >> $GITHUB_OUTPUT
          fi
          echo "buildx_args=\
            --build-arg GIT_DESCRIBE_TAGS=$(git describe --tags --long --always) \
            --build-arg VITE_APP_GIT_DESCRIBE=$(git describe --long --always --dirty --all) \
            --cache-from 'type=local,src=/tmp/.buildx-cache' \
            --cache-from 'type=registry,ref=${DOCKER_IMAGE}:buildcache' \
            --cache-to 'type=local,dest=/tmp/.buildx-cache' \
            ${TAGS} \
            --file ${{ matrix.docker }}/Dockerfile ./${{ matrix.docker }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Cache Docker layers
        uses: actions/cache@v5
        id: cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.docker }}-${{ hashFiles(format('{0}/Dockerfile', matrix.docker)) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.docker }}-${{ hashFiles(format('{0}/Dockerfile', matrix.docker)) }}
            ${{ runner.os }}-buildx-${{ matrix.docker }}

      - name: Docker Buildx (build)
        run: |
          docker buildx build \
            --output "type=image,push=false" \
            --platform ${{ matrix.platforms }} \
            ${{ steps.prepare.outputs.buildx_args }}

      - name: Check core size
        if: ${{ matrix.docker == 'core' }}
        run: |
          # Check if the compressed image size is lower than our limit: that is what a vehicle downloads.
          # A multi-platform build cannot be loaded into docker, so load only amd64.
          IMAGE=${{ steps.prepare.outputs.docker_image }}:${{ steps.prepare.outputs.version }}
          LIMIT_SIZE_MB=700
          docker buildx build \
            --output "type=docker" \
            --platform linux/amd64 \
            ${{ steps.prepare.outputs.buildx_args }}
          # gzip -1 is faster than the level a registry uses, so this slightly overestimates the download.
          UNCOMPRESSED_SIZE_BYTES=$(docker image inspect "${IMAGE}" --format '{{.Size}}')
          COMPRESSED_SIZE_BYTES=$(docker save "${IMAGE}" | gzip -1 | wc -c)
          for SIZE_BYTES in "${UNCOMPRESSED_SIZE_BYTES}" "${COMPRESSED_SIZE_BYTES}"; do
            if ! [[ "${SIZE_BYTES}" =~ ^[0-9]+$ ]] || (( SIZE_BYTES == 0 )); then
              echo "::error::Could not measure the size of ${IMAGE}, got '${SIZE_BYTES}'"
              exit 1
            fi
          done
          UNCOMPRESSED_SIZE_MB=$(( UNCOMPRESSED_SIZE_BYTES / 2**20 ))
          COMPRESSED_SIZE_MB=$(( COMPRESSED_SIZE_BYTES / 2**20 ))
          MESSAGE="Core amd64 size: ${COMPRESSED_SIZE_MB} MB compressed (limit ${LIMIT_SIZE_MB} MB), ${UNCOMPRESSED_SIZE_MB} MB uncompressed"
          echo "${MESSAGE}"
          echo "${MESSAGE}" >> $GITHUB_STEP_SUMMARY
          if (( COMPRESSED_SIZE_MB > LIMIT_SIZE_MB )); then
            echo "::error::${IMAGE} is ${COMPRESSED_SIZE_MB} MB compressed, over the ${LIMIT_SIZE_MB} MB limit"
            exit 1
          fi

      - name: Login to DockerHub
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Buildx (push)
        if: success() && github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --output "type=image,push=true" \
            --platform ${{ matrix.platforms }} \
            ${{ steps.prepare.outputs.buildx_args }} \
            ${{ steps.prepare.outputs.buildx_registry_cache_to }}

      - name: Inspect image
        if: always() && github.event_name != 'pull_request'
        run: |
          docker buildx imagetools \
            inspect ${{ steps.prepare.outputs.docker_image }}:${{ steps.prepare.outputs.version }}

      - name: Create image artifact
        if: success()
        run: |
          DOCKER_IMAGE=${DOCKER_USERNAME:-bluerobotics}/${{ matrix.project }}-${{ matrix.docker }}
          GIT_HASH_SHORT=$(git rev-parse --short "$GITHUB_SHA")
          docker buildx build \
            ${{ steps.prepare.outputs.buildx_args }} \
            --platform "linux/arm64/v8"  \
            --tag ${DOCKER_IMAGE}:${GIT_HASH_SHORT} \
            --output "type=docker,dest=BlueOs-${{ matrix.docker }}-docker-image-${GIT_HASH_SHORT}-arm64-v8.tar" \

      - name: Upload artifact arm64-v8
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: BlueOS-${{ matrix.docker }}-docker-image-arm64-v8
          path: '*arm64-v8.tar'

      - name: Create image artifact
        if: success()
        run: |
          DOCKER_IMAGE=${DOCKER_USERNAME:-bluerobotics}/${{ matrix.project }}-${{ matrix.docker }}
          GIT_HASH_SHORT=$(git rev-parse --short "$GITHUB_SHA")
          docker buildx build \
            ${{ steps.prepare.outputs.buildx_args }} \
            --platform "linux/arm/v7"  \
            --tag ${DOCKER_IMAGE}:${GIT_HASH_SHORT} \
            --output "type=docker,dest=BlueOs-${{ matrix.docker }}-docker-image-${GIT_HASH_SHORT}-arm-v7.tar" \

      - name: Upload artifact arm-v7
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: BlueOS-${{ matrix.docker }}-docker-image-arm-v7
          path: '*arm-v7.tar'

      - name: Create image artifact
        if: success() && matrix.docker == 'core'
        run: |
          DOCKER_IMAGE=${DOCKER_USERNAME:-bluerobotics}/${{ matrix.project }}-${{ matrix.docker }}
          GIT_HASH_SHORT=$(git rev-parse --short "$GITHUB_SHA")
          docker buildx build \
            ${{ steps.prepare.outputs.buildx_args }} \
            --platform "linux/amd64"  \
            --tag ${DOCKER_IMAGE}:${GIT_HASH_SHORT} \
            --output "type=docker,dest=BlueOs-core-docker-image-${GIT_HASH_SHORT}-amd64.tar" \

      - name: Upload artifact amd64
        uses: actions/upload-artifact@v7
        if: success() && matrix.docker == 'core'
        with:
          name: BlueOS-core-docker-image-amd64
          path: '*amd64.tar'

      - name: Upload docker image for release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/') && success() && matrix.docker == 'core'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: '*.tar'
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: true
          file_glob: true

  deploy-raspberry-image:
    needs: deploy-docker-images
    if: >-
      github.repository_owner == 'bluerobotics' &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-images'))
    timeout-minutes: 180 # Detect if it gets into an infinite loop or some unexpected state
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: "linux/arm/v7"
            os: "bookworm"
            board: "bcm_27xx"
            artifact: "arm-v7"
            image: "raspios_lite_armhf/images/raspios_lite_armhf-2024-07-04/2024-07-04-raspios-bookworm-armhf-lite.img.xz"
          - runner: ubuntu-latest
            platform: "linux/arm/v7"
            os: "bullseye"
            board: "bcm_27xx"
            artifact: "arm-v7"
            image: "raspios_lite_armhf/images/raspios_lite_armhf-2022-01-28/2022-01-28-raspios-bullseye-armhf-lite.zip"
          - runner: ubuntu-24.04-arm
            platform: "linux/arm64/v8"
            os: "bookworm"
            board: "bcm_2712"
            artifact: "arm64-v8"
            image: "raspios_lite_arm64/images/raspios_lite_arm64-2024-07-04/2024-07-04-raspios-bookworm-arm64-lite.img.xz"
          - runner: ubuntu-24.04-arm
            platform: "linux/arm64/v8"
            os: "trixie"
            board: "bcm_multi"
            artifact: "arm64-v8"
            container_engine: "podman"
            image: "raspios_lite_arm64/images/raspios_lite_arm64-2026-10-06/2026-10-06-raspios-trixie-arm64-lite.img.xz"

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The image embeds the images built by this run rather than whatever is published for the branch name
      - name: Download docker images
        uses: actions/download-artifact@v8
        with:
          pattern: BlueOS-*-docker-image-${{ matrix.artifact }}
          path: deploy/pimod/images
          merge-multiple: true

      # We use our own pimod as upstream doesn't provide armv7 images
      - name: Pimod Build
        run: |
          PIMOD_VERSION=v0.7.0
          BLUEOS_VERSION=$GITHUB_REF_NAME
          REMOTE=https://raw.githubusercontent.com/$GITHUB_REPOSITORY
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            # A pull request has no raw ref, so label the images built by this run as master and use this checkout's scripts
            BLUEOS_VERSION=master
            mkdir -p /tmp/remote
            ln -sfn $PWD /tmp/remote/$BLUEOS_VERSION
            # The pimod container reaches the host through the docker0 address, so serve only there
            python3 -m http.server 8000 --bind 172.17.0.1 --directory /tmp/remote > /tmp/http.log 2>&1 &
            trap "kill $! || true" EXIT
            REMOTE=http://172.17.0.1:8000
            # The chroot fetches the scripts as soon as it starts, so the server has to be up before that
            curl -fsS --retry 5 --retry-connrefused -o /dev/null $REMOTE/$BLUEOS_VERSION/install/install.sh
          fi
          wget https://raw.githubusercontent.com/Nature40/pimod/${PIMOD_VERSION}/pimod.sh && chmod +x pimod.sh
          # The nested dockerd loads the built images and pulls the extensions, and iptables-nft can't initialize under qemu-user
          docker run --rm --privileged \
            -v $PWD:/files \
            -e PATH=/pimod:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e GITHUB_REPOSITORY=$GITHUB_REPOSITORY \
            -e VERSION=$BLUEOS_VERSION \
            -e REMOTE=$REMOTE \
            -e LOCAL_IMAGES_DIR=/root/blueos-images \
            -e BASE_IMAGE=${{ matrix.image }} \
            -e BOARD=${{ matrix.board }} \
            -e CONTAINER_ENGINE=${{ matrix.container_engine }} \
            -e DOCKER_EXTRA_OPTS="--iptables=false --ip6tables=false --bridge=none" \
            --workdir=/files \
            nature40/pimod:${PIMOD_VERSION} pimod.sh deploy/pimod/blueos.Pifile

      - name: Add /boot additions
        run: |
          # BOARD selects the board install script, so check that the image ended up with the configuration
          # of the board it was built for.
          case "${{ matrix.board }}" in
            bcm_2712)
              EXPECTED=("[pi5]" "dtoverlay=i2c3-pi5,baudrate=400000" "dtoverlay=spi1-3cs")
              ;;
            bcm_27xx)
              EXPECTED=("[pi4]" "dtoverlay=i2c4,pins_6_7,baudrate=1000000" "dtoverlay=spi1-3cs")
              ;;
            bcm_multi)
              EXPECTED=("[pi3]" "[pi4]" "[pi5]" "dtoverlay=i2c4,pins_6_7,baudrate=1000000" "dtoverlay=i2c3-pi5,baudrate=400000" "dtoverlay=spi1-3cs")
              ;;
            *)
              echo "Unknown board ${{ matrix.board }}, add the board configuration its image must contain."
              exit 1
              ;;
          esac
          sudo apt-get update && sudo apt-get install -y parted kpartx
          # Create mount point if it doesn't exist
          sudo mkdir -p /mnt/piboot
          # Map the image file
          LOOP_DEVICE=$(sudo kpartx -avs deploy/pimod/blueos.img | sed -E 's/.*(loop[0-9]+)p[0-9]+.*/\1/g' | head -1)
          # Mount the boot partition
          sudo mount "/dev/mapper/${LOOP_DEVICE}p1" /mnt/piboot
          # Create ssh and userconf files
          sudo cp install/boards/config.toml /mnt/piboot/custom.toml
          # A board install script writing to the /boot stub instead of the boot partition still exits 0,
          # so the image itself is the only place where a missing Navigator configuration can be caught.
          MISSING=()
          for LINE in "${EXPECTED[@]}"; do
            sudo grep -qxF "$LINE" /mnt/piboot/config.txt || MISSING+=("config.txt: $LINE")
          done
          # cmdline.txt is reached through its own path and can be left behind on its own. Whatever
          # board this is, the memory cgroup docker needs is enabled and the serial console that
          # would hold the autopilot port is dropped.
          sudo grep -q "cgroup_enable=memory" /mnt/piboot/cmdline.txt || MISSING+=("cmdline.txt: cgroup_enable=memory")
          if sudo grep -q "console=serial" /mnt/piboot/cmdline.txt; then
            MISSING+=("cmdline.txt: console=serial is still there")
          fi
          sudo umount /mnt/piboot
          sudo kpartx -d deploy/pimod/blueos.img
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "Missing from the boot partition of the ${{ matrix.os }} ${{ matrix.platform }} image built on ${{ matrix.runner }}:"
            printf '  %s\n' "${MISSING[@]}"
            echo "The board install script did not configure the image's boot partition."
            exit 1
          fi
          echo "Boot partition updated successfully."

      - name: Sanitize platform name
        run: echo "SANITIZED_PLATFORM=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_ENV

      - name: Set asset name
        run: |
          if [[ ${{ matrix.board }} == 'bcm_2712' ]]; then
            echo "ASSET_NAME_SUFFIX=-pi5" >> $GITHUB_ENV
          elif [[ ${{ matrix.os }} == 'bullseye' ]]; then
            echo "ASSET_NAME_SUFFIX=-pi4" >> $GITHUB_ENV
          fi

      - name: Print image checksum
        run: sha256sum deploy/pimod/blueos.img

      - name: Zip image
        run: |
          sudo apt install zip
          zip -9 -s 2000m BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.zip deploy/pimod/blueos.img
          ls -lah BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        timeout-minutes: 120
        with:
          name: BlueOS-raspberry-${{ env.GITHUB_REF_NAME }}${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}
          path: BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.z*
          if-no-files-found: error
          retention-days: 7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload to S3
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          aws s3 cp deploy/pimod/blueos.img s3://blueos-downloads/releases/${{ github.ref_name }}/BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.img

      - name: Upload raspberry image for release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # Matches single .zip or multi-volume .z01, .z02, ..., .zip
          file: BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.z*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: true
