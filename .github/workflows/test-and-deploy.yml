name: Test, Build and Deploy Images

on:
    workflow_dispatch:
    pull_request:
      # A new label re-runs the workflow. Pi images stay tied to build-images so an unrelated label does not
      # replace the visible run with a skipped Pi build.
      types: [opened, synchronize, reopened, labeled]
    push:
    schedule:
    # Run every 6 days to keep our caches alive
    - cron: '0 0 */6 * *'

jobs:
  python-tests:
    runs-on: ubuntu-latest

    env:
      python-version: 3.11 # Our base image has Python 3.11

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ env.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get install --no-install-recommends --assume-yes shellcheck parallel

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v8.0.0

    - name: Run tests
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        .hooks/pre-push

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: ./core/htmlcov
        if-no-files-found: ignore


  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bun install
        run: bun install --frozen-lockfile --cwd ./core/frontend

      - name: Bun lint
        run: bun --cwd ./core/frontend lint

      - name: Bun type-check
        run: bun run --cwd ./core/frontend type-check

      - name: Bun build
        run: NODE_OPTIONS=--max-old-space-size=8192 bun run --cwd ./core/frontend build

  image-ref:
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.ref.outputs.image_version }}
      platforms: ${{ steps.ref.outputs.platforms }}
      runners: ${{ steps.ref.outputs.runners }}
      pushed: ${{ steps.ref.outputs.pushed }}
      git_describe_tags: ${{ steps.ref.outputs.git_describe_tags }}
      vite_git_describe: ${{ steps.ref.outputs.vite_git_describe }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Same commit the image build describes. A pull request's default checkout is the merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve image tag
        id: ref
        env:
          # The image namespace is the head repository owner. On a pull request, GITHUB_REPOSITORY is the base.
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            REF_NAME="$GITHUB_HEAD_REF"
          else
            REF_NAME="$GITHUB_REF_NAME"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IMAGE_VERSION="${GITHUB_REF#refs/tags/}"
          else
            # Docker tags cannot contain a slash. This is the same last segment a branch push publishes.
            IMAGE_VERSION="${REF_NAME##*/}"
          fi
          # Fork pull requests have no registry secrets in this step.
          source .github/registry-user.sh
          image_tag_ok "$IMAGE_VERSION" || exit 1
          # One list. The platform array and the runner map are built from it, so they cannot drift.
          entries=(
            "linux/amd64 ubuntu-latest"
            "linux/arm64/v8 ubuntu-24.04-arm"
            # arm/v7 is armhf. An arm64 runner would still emulate that ABI, so this stays on ubuntu-latest.
            "linux/arm/v7 ubuntu-latest"
          )
          platforms=""
          runners=""
          for entry in "${entries[@]}"; do
            platform="${entry%% *}"
            runner="${entry##* }"
            if [[ -n "$platforms" ]]; then
              platforms+=","
              runners+=","
            fi
            platforms+="\"${platform}\""
            runners+="{\"platform\":\"${platform}\",\"runner\":\"${runner}\"}"
          done
          echo "platforms=[${platforms}]" >> "$GITHUB_OUTPUT"
          echo "runners=[${runners}]" >> "$GITHUB_OUTPUT"
          FORK_PULL_REQUEST=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$HEAD_REPOSITORY" && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            FORK_PULL_REQUEST=true
          fi
          # A fork pull request runs on the base repository and does not receive the fork's registry credentials.
          # The branch push publishes. The pull request then pulls sha-<commit> of that publish.
          DOCKER_USER=$(registry_user) || exit 1
          if [[ "$FORK_PULL_REQUEST" == "false" && -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            PUSHED=true
          else
            PUSHED=false
          fi
          if [[ "$PUSHED" == "true" && "${DOCKER_USERNAME,,}" != "$DOCKER_USER" ]]; then
            echo "::error::DOCKER_USERNAME must be the Docker Hub owner of ${DOCKER_USER}/blueos-*" >&2
            exit 1
          fi
          echo "image_version=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pushed=${PUSHED}" >> "$GITHUB_OUTPUT"
          echo "git_describe_tags=$(git describe --tags --long --always)" >> "$GITHUB_OUTPUT"
          echo "vite_git_describe=$(git describe --long --always --dirty --all)" >> "$GITHUB_OUTPUT"
          if [[ "$PUSHED" == "true" ]]; then
            echo "Publishing ${DOCKER_USER}/blueos-*:${IMAGE_VERSION} and sha-<commit>"
          else
            echo "Image tag ${DOCKER_USER}/blueos-*:${IMAGE_VERSION} (pushed=false)"
          fi

  build-docker-images:
    runs-on: ${{ matrix.runner }}
    needs: [frontend-tests, python-tests, image-ref]
    strategy:
      fail-fast: false
      matrix:
        docker: [bootstrap, core]
        project: [blueos]
        platform: ${{ fromJSON(needs.image-ref.outputs.platforms) }}
        include: ${{ fromJSON(needs.image-ref.outputs.runners) }}
    env:
      # The image namespace is the head repository owner. On a pull request, GITHUB_REPOSITORY is the base.
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A pull request checkout is the merge commit. Publish the branch tip, which is what the push run tags.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: recursive

      - name: Prepare
        id: prepare
        run: |
          PLATFORM_SLUG=$(echo "${{ matrix.platform }}" | tr '/' '-')
          PLATFORM_SUFFIX=${PLATFORM_SLUG#linux-}
          echo "platform_slug=${PLATFORM_SLUG}" >> "$GITHUB_OUTPUT"
          echo "platform_suffix=${PLATFORM_SUFFIX}" >> "$GITHUB_OUTPUT"
          # One cache tag per platform. Only master writes it, so other refs cannot overwrite it.
          if [[ "$GITHUB_REF" == "refs/heads/master" && "${{ needs.image-ref.outputs.pushed }}" == "true" ]]; then
            echo "write_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "write_cache=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Cache Docker layers
        uses: actions/cache@v5
        id: cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.docker }}-${{ steps.prepare.outputs.platform_slug }}-${{ hashFiles(format('{0}/Dockerfile', matrix.docker)) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.docker }}-${{ steps.prepare.outputs.platform_slug }}-

      - name: Login to DockerHub
        if: needs.image-ref.outputs.pushed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Buildx (build)
        env:
          GIT_DESCRIBE_TAGS: ${{ needs.image-ref.outputs.git_describe_tags }}
          VITE_APP_GIT_DESCRIBE: ${{ needs.image-ref.outputs.vite_git_describe }}
        run: |
          set -euo pipefail
          # Fork pull requests have no registry secrets in this step.
          source .github/registry-user.sh
          REGISTRY_USER=$(registry_user) || exit 1
          DOCKER_IMAGE="${REGISTRY_USER}/${{ matrix.project }}-${{ matrix.docker }}"
          CACHE_IMAGE="${REGISTRY_USER}/${{ matrix.project }}-buildcache"
          CACHE_IMAGE="${CACHE_IMAGE}:${{ matrix.docker }}-master-${{ steps.prepare.outputs.platform_slug }}"
          OUTPUTS=()
          if [[ "${{ needs.image-ref.outputs.pushed }}" == "true" ]]; then
            OUTPUTS+=(--output "type=image,name=${DOCKER_IMAGE},push-by-digest=true,name-canonical=true,push=true")
          fi
          archive="BlueOs-${{ matrix.docker }}-docker-image-${{ steps.prepare.outputs.platform_suffix }}.tar"
          OUTPUTS+=(--output "type=docker,dest=${archive}")
          CACHE_TO=()
          if [[ "${{ steps.prepare.outputs.write_cache }}" == "true" ]]; then
            CACHE_TO+=(--cache-to "type=registry,ref=${CACHE_IMAGE},mode=max")
          fi
          # Provenance would wrap each platform in its own index, and the merge would nest those.
          docker buildx build \
            --metadata-file /tmp/build-metadata.json \
            --provenance=false \
            --sbom=false \
            --build-arg GIT_DESCRIBE_TAGS="$GIT_DESCRIBE_TAGS" \
            --build-arg VITE_APP_GIT_DESCRIBE="$VITE_APP_GIT_DESCRIBE" \
            --cache-from "type=local,src=/tmp/.buildx-cache" \
            --cache-from "type=registry,ref=${CACHE_IMAGE}" \
            --cache-to "type=local,dest=/tmp/.buildx-cache" \
            "${CACHE_TO[@]}" \
            "${OUTPUTS[@]}" \
            --platform "${{ matrix.platform }}" \
            --file "${{ matrix.docker }}/Dockerfile" \
            "./${{ matrix.docker }}"

      - name: Check core size
        if: matrix.docker == 'core' && matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          # gzip -1 is faster than the level a registry uses, so this slightly overestimates the download.
          LIMIT_SIZE_MB=700
          CORE_ARCHIVE=BlueOs-core-docker-image-amd64.tar
          LOADED=$(docker load -i "$CORE_ARCHIVE")
          echo "$LOADED"
          IMAGE_ID=$(echo "$LOADED" | sed -n 's/^Loaded image ID: //p; s/^Loaded image: //p' | head -1)
          if [[ -z "$IMAGE_ID" ]]; then
            echo "::error::Could not load ${CORE_ARCHIVE}" >&2
            exit 1
          fi
          UNCOMPRESSED_SIZE_BYTES=$(docker image inspect "$IMAGE_ID" --format '{{.Size}}')
          COMPRESSED_SIZE_BYTES=$(gzip -1 -c "$CORE_ARCHIVE" | wc -c)
          for SIZE_BYTES in "$UNCOMPRESSED_SIZE_BYTES" "$COMPRESSED_SIZE_BYTES"; do
            if ! [[ "$SIZE_BYTES" =~ ^[0-9]+$ ]] || (( SIZE_BYTES == 0 )); then
              echo "::error::Could not measure the core image, got '${SIZE_BYTES}'"
              exit 1
            fi
          done
          UNCOMPRESSED_SIZE_MB=$(( UNCOMPRESSED_SIZE_BYTES / 2**20 ))
          COMPRESSED_SIZE_MB=$(( COMPRESSED_SIZE_BYTES / 2**20 ))
          MESSAGE="Core amd64 size: ${COMPRESSED_SIZE_MB} MB compressed (limit ${LIMIT_SIZE_MB} MB), ${UNCOMPRESSED_SIZE_MB} MB uncompressed"
          echo "$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          if (( COMPRESSED_SIZE_MB > LIMIT_SIZE_MB )); then
            echo "::error::core amd64 is ${COMPRESSED_SIZE_MB} MB compressed, over the ${LIMIT_SIZE_MB} MB limit"
            exit 1
          fi

      - name: Upload docker image archive
        uses: actions/upload-artifact@v7
        with:
          name: BlueOs-${{ matrix.docker }}-docker-image-${{ steps.prepare.outputs.platform_suffix }}
          path: BlueOs-${{ matrix.docker }}-docker-image-${{ steps.prepare.outputs.platform_suffix }}.tar
          if-no-files-found: error

      - name: Export digest
        if: needs.image-ref.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)
          if [[ "$DIGEST" != sha256:* ]]; then
            echo "::error::Build did not record a digest: ${DIGEST}" >&2
            exit 1
          fi
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.image-ref.outputs.pushed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.docker }}-${{ steps.prepare.outputs.platform_slug }}
          path: /tmp/digests/*
          if-no-files-found: error

  deploy-docker-images:
    runs-on: ubuntu-latest
    needs: [build-docker-images, image-ref]
    if: needs.build-docker-images.result == 'success' && needs.image-ref.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        docker: [bootstrap, core]
        project: [blueos]
    env:
      # The image namespace is the head repository owner. On a pull request, GITHUB_REPOSITORY is the base.
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout
        if: needs.image-ref.outputs.pushed == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download digests
        if: needs.image-ref.outputs.pushed == 'true'
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.docker }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: needs.image-ref.outputs.pushed == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Login to DockerHub
        if: needs.image-ref.outputs.pushed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-platform image
        if: needs.image-ref.outputs.pushed == 'true'
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # Fork pull requests have no registry secrets in this step.
          source "$GITHUB_WORKSPACE/.github/registry-user.sh"
          REGISTRY_USER=$(registry_user) || exit 1
          DOCKER_IMAGE="${REGISTRY_USER}/${{ matrix.project }}-${{ matrix.docker }}"
          VERSION=${{ needs.image-ref.outputs.image_version }}
          # The branch tag moves. sha-<commit> is what a fork pull request pulls, so it cannot use an older branch tag.
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          TAGS=(--tag "${DOCKER_IMAGE}:${VERSION}" --tag "${DOCKER_IMAGE}:sha-${COMMIT_SHA}")
          if [[ "$GITHUB_REF" == refs/tags/* && "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS+=(--tag "${DOCKER_IMAGE}:latest")
          fi
          mapfile -t digests < <(find . -type f -printf '%f\n' | sort)
          EXPECTED_PLATFORMS=$(jq -r 'length' <<< '${{ needs.image-ref.outputs.platforms }}')
          if [[ ${#digests[@]} -ne "$EXPECTED_PLATFORMS" ]]; then
            echo "::error::Expected ${EXPECTED_PLATFORMS} platform digests for ${DOCKER_IMAGE}, found ${#digests[@]}"
            find . -type f
            exit 1
          fi
          refs=()
          for digest in "${digests[@]}"; do
            refs+=("${DOCKER_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${TAGS[@]}" "${refs[@]}"
          echo "Published ${DOCKER_IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect image
        if: needs.image-ref.outputs.pushed == 'true'
        run: |
          # Fork pull requests have no registry secrets in this step.
          source "$GITHUB_WORKSPACE/.github/registry-user.sh"
          REGISTRY_USER=$(registry_user) || exit 1
          docker buildx imagetools inspect \
            "${REGISTRY_USER}/${{ matrix.project }}-${{ matrix.docker }}:${{ needs.image-ref.outputs.image_version }}"

      - name: Download core release archives
        if: startsWith(github.ref, 'refs/tags/') && matrix.docker == 'core'
        uses: actions/download-artifact@v7
        with:
          pattern: BlueOs-core-docker-image-*
          merge-multiple: true

      - name: Upload docker image for release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.docker == 'core'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BlueOs-core-docker-image-*.tar
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: true
          file_glob: true

  deploy-raspberry-image:
    needs: [deploy-docker-images, image-ref]
    # A fork's own push bakes its Pi image. Only the schedule is limited to the bluerobotics owner.
    if: >-
      needs.deploy-docker-images.result == 'success' &&
      needs.image-ref.result == 'success' &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-images')) &&
      (github.event.action != 'labeled' || github.event.label.name == 'build-images') &&
      (github.event_name != 'schedule' || github.repository_owner == 'bluerobotics')
    timeout-minutes: 180 # Detect if it gets into an infinite loop or some unexpected state
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: "linux/arm/v7"
            os: "bookworm"
            board: "bcm_27xx"
            image: "raspios_lite_armhf/images/raspios_lite_armhf-2024-07-04/2024-07-04-raspios-bookworm-armhf-lite.img.xz"
          - runner: ubuntu-latest
            platform: "linux/arm/v7"
            os: "bullseye"
            board: "bcm_27xx"
            image: "raspios_lite_armhf/images/raspios_lite_armhf-2022-01-28/2022-01-28-raspios-bullseye-armhf-lite.zip"
          - runner: ubuntu-24.04-arm
            platform: "linux/arm64/v8"
            os: "bookworm"
            board: "bcm_2712"
            image: "raspios_lite_arm64/images/raspios_lite_arm64-2024-07-04/2024-07-04-raspios-bookworm-arm64-lite.img.xz"

    runs-on: ${{ matrix.runner }}
    env:
      # The image namespace is the head repository owner. On a pull request, GITHUB_REPOSITORY is the base.
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      # We use our own pimod as upstream doesn't provide armv7 images.
      # A run that published pulls the branch tag it just created. A fork pull request has no registry
      # secret, so it pulls sha-<commit>, which the branch push publishes for this same commit.
      - name: Pimod Build
        run: |
          PIMOD_VERSION=v0.7.0
          BLUEOS_VERSION=$GITHUB_REF_NAME
          REMOTE=https://raw.githubusercontent.com/$GITHUB_REPOSITORY
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            # A pull request has no raw ref, so serve this checkout's scripts. The image tag is separate.
            BLUEOS_VERSION=master
            mkdir -p /tmp/remote
            ln -sfn $PWD /tmp/remote/$BLUEOS_VERSION
            # The pimod container reaches the host through the docker0 address, so serve only there
            python3 -m http.server 8000 --bind 172.17.0.1 --directory /tmp/remote > /tmp/http.log 2>&1 &
            trap "kill $! || true" EXIT
            REMOTE=http://172.17.0.1:8000
            # The chroot fetches the scripts as soon as it starts, so the server has to be up before that
            curl -fsS --retry 5 --retry-connrefused -o /dev/null $REMOTE/$BLUEOS_VERSION/install/install.sh
          fi
          wget https://raw.githubusercontent.com/Nature40/pimod/${PIMOD_VERSION}/pimod.sh && chmod +x pimod.sh
          # Fork pull requests receive empty registry secrets. Do not log in above this source.
          source .github/registry-user.sh
          REGISTRY_USER=$(registry_user) || exit 1
          if [[ "${{ needs.image-ref.outputs.pushed }}" == "true" ]]; then
            IMAGE_VERSION="${{ needs.image-ref.outputs.image_version }}"
            PULL_ATTEMPTS=3
          else
            if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
              echo "::error::Nothing publishes ${REGISTRY_USER}/blueos-* without DOCKER_USERNAME and DOCKER_PASSWORD." >&2
              exit 1
            fi
            IMAGE_VERSION="sha-${{ github.event.pull_request.head.sha || github.sha }}"
            PULL_ATTEMPTS=30
            echo "Waiting for ${REGISTRY_USER}/blueos-*:${IMAGE_VERSION}."
            echo "The branch push publishes that tag and needs DOCKER_USERNAME and DOCKER_PASSWORD on the fork."
          fi
          image_tag_ok "$IMAGE_VERSION" || exit 1
          # The nested dockerd pulls the images and the extensions, and iptables-nft can't initialize under qemu-user
          docker run --rm --privileged \
            -v $PWD:/files \
            -e PATH=/pimod:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e GITHUB_REPOSITORY=$GITHUB_REPOSITORY \
            -e VERSION=$BLUEOS_VERSION \
            -e IMAGE_VERSION="$IMAGE_VERSION" \
            -e DOCKER_USER="$REGISTRY_USER" \
            -e DOCKER_USERNAME \
            -e DOCKER_PASSWORD \
            -e PULL_ATTEMPTS="$PULL_ATTEMPTS" \
            -e DOCKER_PLATFORM=${{ matrix.platform }} \
            -e REMOTE=$REMOTE \
            -e BASE_IMAGE=${{ matrix.image }} \
            -e BOARD=${{ matrix.board }} \
            -e DOCKER_EXTRA_OPTS="--iptables=false --ip6tables=false --bridge=none" \
            --workdir=/files \
            nature40/pimod:${PIMOD_VERSION} pimod.sh deploy/pimod/blueos.Pifile

      - name: Add /boot additions
        run: |
          # BOARD selects the board install script, so check that the image ended up with the configuration
          # of the board it was built for.
          case "${{ matrix.board }}" in
            bcm_2712)
              EXPECTED=("[pi5]" "dtoverlay=i2c3-pi5,baudrate=400000" "dtoverlay=spi1-3cs")
              ;;
            bcm_27xx)
              EXPECTED=("[pi4]" "dtoverlay=i2c4,pins_6_7,baudrate=1000000" "dtoverlay=spi1-3cs")
              ;;
            *)
              echo "Unknown board ${{ matrix.board }}, add the board configuration its image must contain."
              exit 1
              ;;
          esac
          sudo apt-get update && sudo apt-get install -y parted kpartx
          # Create mount point if it doesn't exist
          sudo mkdir -p /mnt/piboot
          # Map the image file
          LOOP_DEVICE=$(sudo kpartx -avs deploy/pimod/blueos.img | sed -E 's/.*(loop[0-9]+)p[0-9]+.*/\1/g' | head -1)
          # Mount the boot partition
          sudo mount "/dev/mapper/${LOOP_DEVICE}p1" /mnt/piboot
          # Create ssh and userconf files
          sudo cp install/boards/config.toml /mnt/piboot/custom.toml
          # A board install script writing to the /boot stub instead of the boot partition still exits 0,
          # so the image itself is the only place where a missing Navigator configuration can be caught.
          MISSING=()
          for LINE in "${EXPECTED[@]}"; do
            sudo grep -qxF "$LINE" /mnt/piboot/config.txt || MISSING+=("config.txt: $LINE")
          done
          # cmdline.txt is reached through its own path and can be left behind on its own. Whatever
          # board this is, the memory cgroup docker needs is enabled and the serial console that
          # would hold the autopilot port is dropped.
          sudo grep -q "cgroup_enable=memory" /mnt/piboot/cmdline.txt || MISSING+=("cmdline.txt: cgroup_enable=memory")
          if sudo grep -q "console=serial" /mnt/piboot/cmdline.txt; then
            MISSING+=("cmdline.txt: console=serial is still there")
          fi
          sudo umount /mnt/piboot
          sudo kpartx -d deploy/pimod/blueos.img
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "Missing from the boot partition of the ${{ matrix.os }} ${{ matrix.platform }} image built on ${{ matrix.runner }}:"
            printf '  %s\n' "${MISSING[@]}"
            echo "The board install script did not configure the image's boot partition."
            exit 1
          fi
          echo "Boot partition updated successfully."

      - name: Sanitize platform name
        run: echo "SANITIZED_PLATFORM=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_ENV

      - name: Set asset name
        run: |
          if [[ ${{ matrix.board }} == 'bcm_2712' ]]; then
            echo "ASSET_NAME_SUFFIX=-pi5" >> $GITHUB_ENV
          elif [[ ${{ matrix.os }} == 'bullseye' ]]; then
            echo "ASSET_NAME_SUFFIX=-pi4" >> $GITHUB_ENV
          fi

      - name: Print image checksum
        run: sha256sum deploy/pimod/blueos.img

      - name: Zip image
        run: |
          sudo apt install zip
          zip -9 -s 2000m BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.zip deploy/pimod/blueos.img
          ls -lah BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        timeout-minutes: 120
        with:
          name: BlueOS-raspberry-${{ env.GITHUB_REF_NAME }}${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}
          path: BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.z*
          if-no-files-found: error
          retention-days: 7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload to S3
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          aws s3 cp deploy/pimod/blueos.img s3://blueos-downloads/releases/${{ github.ref_name }}/BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.img

      - name: Upload raspberry image for release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # Matches single .zip or multi-volume .z01, .z02, ..., .zip
          file: BlueOS-raspberry-${{ env.SANITIZED_PLATFORM }}-${{ matrix.os }}${{ env.ASSET_NAME_SUFFIX }}.z*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: true
