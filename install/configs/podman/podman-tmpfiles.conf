# Same as /usr/lib/tmpfiles.d/podman.conf, which this file masks, except that /run/podman is traversable (0755).
# The BlueOS core container reaches the socket as the pi user over ssh, and needs to go through this directory.
x /tmp/podman-run-*
x /tmp/storage-run-*
x /tmp/containers-user-*
x /tmp/run-*/libpod
D! /var/lib/containers/storage/tmp 0700 root root
D! /run/podman 0755 root root
D! /var/lib/cni/networks
R! /var/tmp/container_images*
