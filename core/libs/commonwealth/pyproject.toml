[project]
name = "commonwealth"
version = "0.1.0"
description = "BlueOS library to share common code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.13.2",
    "appdirs==1.4.4",
    "eclipse-zenoh==1.9.0",
    "loguru==0.7.3",
    "packaging==25.0",
    "psutil==7.1.3",
    "pydantic==2.12.5",
    "sentry-sdk==2.29.1",
    "starlette>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
